<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b4a1c">
<title>Nagybani Beszerzés</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--g1:#1b4a1c;--g2:#5a9a32;--g3:#8cc63f;--cream:#f4f9ec;--ink:#12261a;--glass:rgba(255,255,255,.84);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--g1);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);touch-action:manipulation}
button{font-family:inherit;cursor:pointer}
#map{position:absolute;inset:0;z-index:0}
.leaflet-top.leaflet-right{top:calc(64px + var(--sat))}
.leaflet-container{background:#cfe3b4}

/* ===== fejléc és HUD ===== */
#hdr{position:fixed;top:0;left:0;right:0;z-index:800;padding:calc(10px + var(--sat)) 12px 10px;display:flex;align-items:center;gap:10px;pointer-events:none}
#hdr>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;line-height:1;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:7px 14px 8px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.brand b{font:900 17px Georgia,"Times New Roman",serif;color:var(--g1);letter-spacing:.5px}
.brand i{font:600 10px "Trebuchet MS",sans-serif;color:var(--g2);letter-spacing:5px;font-style:normal;margin-top:2px;text-align:center}
#roleChip{margin-left:auto;background:linear-gradient(135deg,var(--g2),var(--g1));color:#fff;border-radius:16px;padding:9px 14px;font-weight:800;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:6px;align-items:center}
#menuBtn{width:44px;height:44px;border-radius:50%;border:none;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:20px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#hud{position:fixed;top:calc(66px + var(--sat));left:12px;z-index:700;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:14px;padding:8px 13px;font-weight:700;font-size:13px;color:var(--g1);box-shadow:0 6px 18px rgba(0,0,0,.22);animation:slideIn .5s both}
#hud small{display:block;font-weight:600;color:#4b6b4d;font-size:11px}
#fab{position:fixed;left:50%;bottom:calc(22px + var(--sab));transform:translateX(-50%);z-index:700;border:none;border-radius:34px;padding:0 26px;height:66px;color:#fff;font-size:18px;font-weight:900;letter-spacing:.3px;background:linear-gradient(135deg,var(--g3),var(--g2) 45%,var(--g1));box-shadow:0 12px 30px rgba(27,74,28,.65),inset 0 2px 0 rgba(255,255,255,.35);display:none;align-items:center;gap:10px;animation:fabIn .7s cubic-bezier(.2,1.5,.4,1) both,glow 2.6s 1s infinite}
#fab{white-space:nowrap}
#fab span{font-size:26px}
#fab:active{transform:translateX(-50%) scale(.95)}
#colChip{position:fixed;left:50%;bottom:calc(26px + var(--sab));transform:translateX(-50%);z-index:700;display:none;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:30px;padding:14px 22px;font-weight:800;color:var(--g1);box-shadow:0 12px 30px rgba(0,0,0,.35);white-space:nowrap;animation:fabIn .7s cubic-bezier(.2,1.5,.4,1) both}
body.shopper #fab{display:flex}
body.collector #colChip{display:block}
#locBtn{position:fixed;right:14px;bottom:calc(110px + var(--sab));z-index:700;width:54px;height:54px;border-radius:50%;border:none;background:#fff;font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#locBtn:active{transform:scale(.92)}

/* ===== kék pötty ===== */
.me-ico{background:none;border:none}
.me{position:relative;width:44px;height:44px}
.me .pulse{position:absolute;inset:0;border-radius:50%;background:rgba(26,115,232,.35);animation:pulse 2.2s ease-out infinite}
.me .pulse.p2{animation-delay:1.1s}
.me .dot{position:absolute;left:13px;top:13px;width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 8px rgba(0,0,0,.55)}
.me.virt .dot{background:#7c4dff}
.me.virt .pulse{background:rgba(124,77,255,.35)}

/* ===== tűk ===== */
.stand-ico{background:none;border:none}
.pin{position:relative;width:44px;height:48px}
.pin .bub{position:absolute;left:2px;top:0;width:40px;height:40px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:linear-gradient(135deg,var(--g3),var(--g1));border:3px solid #fff;box-shadow:0 5px 12px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.pin .bub span{transform:rotate(45deg);font-size:19px;line-height:1}
.pin .lbl{position:absolute;left:50%;top:-24px;transform:translateX(-50%);white-space:nowrap;background:rgba(255,255,255,.94);border-radius:10px;padding:2px 8px;font:800 11px Arial,sans-serif;color:var(--g1);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin.sel .bub{box-shadow:0 0 0 6px rgba(255,193,7,.6),0 5px 12px rgba(0,0,0,.5)}
.pin.done .bub{background:linear-gradient(135deg,#cfd8cf,#8a968a);opacity:.7}
.pin.done .lbl{opacity:.7;text-decoration:line-through}
.pin.drop .bub{animation:drop .75s cubic-bezier(.3,1.7,.5,1) both}
.pin.drop .lbl{animation:fadeUp .6s .5s both}
.pin.drop::after{content:"";position:absolute;left:12px;bottom:-4px;width:20px;height:8px;border-radius:50%;border:3px solid rgba(255,255,255,.9);animation:ripple 1.1s .45s ease-out both}
.pin.near .bub{animation:bob 1s ease-in-out infinite}

/* ===== lap (bottom sheet) ===== */
#bd{position:fixed;inset:0;z-index:1100;background:rgba(5,20,8,.45);opacity:0;pointer-events:none;transition:opacity .3s}
#bd.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:1200;background:rgba(255,255,255,.95);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:26px 26px 0 0;box-shadow:0 -14px 40px rgba(0,0,0,.4);padding:10px 18px calc(20px + var(--sab));transform:translateY(110%);transition:transform .42s cubic-bezier(.2,1.25,.3,1);max-height:88vh;overflow-y:auto}
#sheet.open{transform:none}
#sheet.quarter{min-height:25vh}
.grab{width:46px;height:5px;border-radius:3px;background:#c5d3c0;margin:0 auto 12px}
#sheet h3{margin:0 0 12px;color:var(--g1);font-size:20px}
.row{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.big{font-size:44px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.ttl{font-weight:900;font-size:19px;color:var(--ink)}
.sub{color:#4b6b4d;font-size:14px;margin-top:2px}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:800;margin-right:6px}
.b-ok{background:#dff3cf;color:#1b5e20}.b-no{background:#ffe0b2;color:#a04a00}.b-bad{background:#ffcdd2;color:#b71c1c}
.thumb{width:100%;max-height:150px;object-fit:cover;border-radius:14px;margin-bottom:12px}
.btns{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;border:none;border-radius:16px;padding:15px;font-weight:900;font-size:16px}
.btn.go{background:linear-gradient(135deg,var(--g3),var(--g1));color:#fff;box-shadow:0 8px 18px rgba(27,74,28,.4)}
.btn.ghost{background:#e9efe5;color:#3d5a40}
.btn.red{background:#ffebee;color:#c62828}
.btn:active{transform:scale(.96)}
label.f{display:block;font-size:12px;font-weight:800;color:#4b6b4d;margin:0 0 4px 4px;text-transform:uppercase;letter-spacing:.6px}
.in{width:100%;border:2px solid #d4e2cd;background:#fff;border-radius:14px;padding:13px 14px;font-size:17px;font-family:inherit;margin-bottom:12px;outline:none;transition:border-color .2s,box-shadow .2s}
.in:focus{border-color:var(--g2);box-shadow:0 0 0 4px rgba(90,154,50,.2)}
textarea.in{min-height:64px;resize:none}
.two{display:flex;gap:10px}.two>div{flex:1}
.sw{display:flex;align-items:center;gap:10px;background:#f1f7ec;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:800;color:var(--g1);user-select:none}
.tg{position:relative;width:52px;height:30px;border-radius:15px;background:#c8d3c3;margin-left:auto;transition:background .25s;flex:none}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.35);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.tg.on{background:var(--g2)}.tg.on::after{transform:translateX(22px)}
.photoBtn{display:flex;align-items:center;gap:10px;background:#f1f7ec;border:2px dashed #b7cfa9;border-radius:14px;padding:12px 14px;font-weight:800;color:var(--g1);margin-bottom:12px;width:100%;font-size:15px}
.photoBtn img{width:44px;height:44px;border-radius:10px;object-fit:cover}

/* ===== menü ===== */
#menu{position:fixed;top:calc(62px + var(--sat));right:12px;z-index:1250;background:#fff;border-radius:18px;padding:6px;box-shadow:0 14px 40px rgba(0,0,0,.4);display:none;min-width:210px;transform-origin:top right}
#menu.on{display:block;animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
#menu button{display:flex;gap:12px;align-items:center;width:100%;border:none;background:none;padding:14px 16px;font-size:16px;font-weight:700;color:var(--g1);border-radius:12px;text-align:left}
#menu button:active{background:#eef6e8}

/* ===== teljes oldal ===== */
#page{position:fixed;inset:0;z-index:1300;background:var(--cream);transform:translateY(100%);transition:transform .4s cubic-bezier(.2,1,.3,1);display:flex;flex-direction:column}
#page.open{transform:none}
#pageHd{display:flex;align-items:center;gap:10px;padding:calc(14px + var(--sat)) 16px 14px;background:linear-gradient(135deg,var(--g2),var(--g1));color:#fff}
#pageHd h2{margin:0;font-size:21px;flex:1}
#pageX{width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.22);color:#fff;font-size:20px}
#pageBody{flex:1;overflow-y:auto;padding:14px 14px calc(30px + var(--sab))}
.day{background:#fff;border-radius:20px;margin-bottom:14px;box-shadow:0 6px 18px rgba(27,74,28,.12);overflow:hidden;animation:slideIn .5s both}
.dayH{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;background:linear-gradient(135deg,#e9f5dc,#f7fbf1);font-weight:900;color:var(--g1);gap:8px}
.dayH small{display:block;font-weight:700;color:#5e7a5f;font-size:12px}
.dayH .sum{font-size:18px;white-space:nowrap}
.it{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid #edf3e8}
.it .em{font-size:28px}
.it .mid{flex:1;min-width:0}
.it .mid b{display:block;font-size:16px}
.it .mid span{font-size:12px;color:#5e7a5f}
.it .mk{border:none;border-radius:12px;padding:8px 10px;font-weight:800;font-size:12px;background:#e9efe5;color:#3d5a40}
.chips{display:flex;gap:8px;margin-bottom:14px}
.chp{border:none;border-radius:20px;padding:10px 16px;font-weight:800;background:#e3ecdc;color:#3d5a40;font-size:14px}
.chp.on{background:var(--g1);color:#fff}
.empty{text-align:center;color:#6c876c;padding:50px 20px;font-weight:700}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 5px 16px rgba(27,74,28,.1)}
.card h4{margin:0 0 10px;color:var(--g1)}
.plc{display:block;width:100%;text-align:left;border:2px solid #dbe8d2;background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;font-weight:800;color:var(--ink);font-size:15px}
.plc small{display:block;font-weight:600;color:#6c876c;margin-top:2px}
.plc.on{border-color:var(--g2);background:#eef7e6}
.mono{font:12px/1.6 ui-monospace,Menlo,monospace;color:#3d5a40;word-break:break-all}
input[type=range]{width:100%;accent-color:var(--g2)}

/* ===== szerepválasztó + splash ===== */
#splash,#picker{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#splash{z-index:1600;background:radial-gradient(circle at 50% 38%,#fff 0%,#eef8e2 55%,#cfe8b2 100%);transition:opacity .6s,transform .6s}
#splash.out{opacity:0;transform:scale(1.15);pointer-events:none}
#splashLogo{width:min(78vw,60vh,420px);animation:breathe 3s ease-in-out infinite}
#picker{z-index:1500;background:linear-gradient(160deg,#0f3512,#1b4a1c 55%,#2c6a22);display:none;color:#fff;overflow-y:auto}
#picker.on{display:flex}
#pickerLogo{width:min(46vw,200px);margin-bottom:6px;background:#fff;border-radius:50%;padding:6px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
#picker h2{margin:12px 0 4px;font-size:24px}
#picker p{margin:0 0 20px;opacity:.8;font-size:14px}
.role{width:100%;max-width:380px;border:none;border-radius:24px;padding:20px 22px;margin-bottom:14px;display:flex;gap:16px;align-items:center;text-align:left;background:rgba(255,255,255,.95);color:var(--g1);box-shadow:0 14px 30px rgba(0,0,0,.35);animation:fabIn .7s cubic-bezier(.2,1.4,.4,1) both}
.role:nth-of-type(2){animation-delay:.15s}
.role .ic{font-size:44px}
.role b{display:block;font-size:20px}
.role span{font-size:13px;color:#4b6b4d}
.role:active{transform:scale(.97)}

#toast{position:fixed;left:50%;top:calc(120px + var(--sat));transform:translate(-50%,-20px);z-index:1400;background:rgba(18,38,26,.94);color:#fff;padding:11px 18px;border-radius:16px;font-weight:700;font-size:14px;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.2,1.3,.4,1);box-shadow:0 10px 26px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.leaf{position:fixed;z-index:1450;font-size:26px;pointer-events:none;left:50%;bottom:20%;animation:leaf 1.4s cubic-bezier(.2,.8,.4,1) forwards}

/* ===== logó animáció ===== */
.lg{width:100%;height:auto;display:block;overflow:visible}
.lg .ring{stroke-dasharray:1420;stroke-dashoffset:1420;animation:draw 1.7s .1s cubic-bezier(.6,0,.3,1) forwards}
.lg .ring2{stroke-dasharray:1340;stroke-dashoffset:1340;animation:draw 1.9s .5s cubic-bezier(.6,0,.3,1) forwards}
.lg .crate{opacity:0;animation:crateIn .6s .5s cubic-bezier(.3,1.5,.5,1) forwards;transform-box:fill-box;transform-origin:center bottom}
.lg .veg{opacity:0;transform-box:fill-box;transform-origin:center bottom;animation:vegIn .55s cubic-bezier(.3,1.9,.5,1) forwards}
.lg .truck{opacity:0;animation:truckIn 1s 1.1s cubic-bezier(.2,.9,.3,1) forwards}
.lg .spd{transform-box:fill-box;transform-origin:right center;animation:spd .5s 1.9s ease-in-out infinite alternate}
.lg .wheel{transform-box:fill-box;transform-origin:center;animation:spin .8s linear infinite}
.lg .t1,.lg .t2,.lg .t3{opacity:0;animation:fadeUp .7s forwards}
.lg .t1{animation-delay:1.3s}.lg .t2{animation-delay:1.55s}.lg .t3{animation-delay:1.8s}
.lg .leafA,.lg .leafB{transform-box:fill-box;transform-origin:left bottom;transform:scale(0);animation:grow .8s 2s cubic-bezier(.3,1.6,.5,1) forwards}
.lg .leafB{animation-delay:2.2s}

@keyframes draw{to{stroke-dashoffset:0}}
@keyframes crateIn{from{opacity:0;transform:translateY(-60px) scale(.8)}to{opacity:1;transform:none}}
@keyframes vegIn{from{opacity:0;transform:translateY(-90px) scale(.5)}to{opacity:1;transform:none}}
@keyframes truckIn{from{opacity:0;transform:translateX(150px)}to{opacity:1;transform:none}}
@keyframes spd{from{transform:scaleX(.55)}to{transform:scaleX(1.1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes grow{to{transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes pulse{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes drop{0%{transform:translateY(-130px) rotate(-45deg);opacity:0}60%{opacity:1}100%{transform:translateY(0) rotate(-45deg);opacity:1}}
@keyframes ripple{0%{transform:scale(.3);opacity:1}100%{transform:scale(3.2);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-45deg)}50%{transform:translateY(-7px) rotate(-45deg)}}
@keyframes slideIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes fabIn{from{opacity:0;transform:translateX(-50%) translateY(80px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes glow{0%,100%{box-shadow:0 12px 30px rgba(27,74,28,.65),inset 0 2px 0 rgba(255,255,255,.35),0 0 0 0 rgba(140,198,63,.6)}50%{box-shadow:0 12px 30px rgba(27,74,28,.65),inset 0 2px 0 rgba(255,255,255,.35),0 0 0 14px rgba(140,198,63,0)}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes leaf{0%{transform:translate(0,0) rotate(0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1.1);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.lg .ring,.lg .ring2{stroke-dashoffset:0}.lg .crate,.lg .veg,.lg .truck,.lg .t1,.lg .t2,.lg .t3{opacity:1}.lg .leafA,.lg .leafB{transform:none}}
</style>
</head>
<body>

<div id="map"></div>

<div id="hdr">
  <div class="brand"><b>NAGYBANI</b><i>GASTRO</i></div>
  <div id="roleChip"></div>
  <button id="menuBtn" aria-label="Menü">☰</button>
</div>
<div id="hud"></div>
<button id="locBtn" aria-label="Saját helyzet">📍</button>
<button id="fab"><span>🛒</span>Vásárlás rögzítése</button>
<div id="colChip"></div>

<div id="menu">
  <button data-m="hist">🕘 Előzmények</button>
  <button data-m="dev">🛠 Fejlesztői</button>
  <button data-m="role">🔁 Szerepváltás</button>
</div>

<div id="bd"></div>
<div id="sheet"></div>
<div id="page"><div id="pageHd"><h2 id="pageT"></h2><button id="pageX">✕</button></div><div id="pageBody"></div></div>
<div id="toast"></div>

<div id="picker">
  <div id="pickerLogo"></div>
  <h2>Ki vagy most?</h2>
  <p>Válaszd ki, mit csinálsz éppen a piacon</p>
  <button class="role" data-r="shopper"><span class="ic">🧺</span><div><b>Bevásárló</b><span>Vásárláskor tűt rakok le a térképre</span></div></button>
  <button class="role" data-r="collector"><span class="ic">🚚</span><div><b>Beszerző</b><span>Autóval összeszedem a félretett árut</span></div></button>
</div>

<div id="splash"><div id="splashLogo"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function(){
'use strict';

/* ====== LOGÓ (SVG, animálható) ====== */
function logoSVG(){
  return '<svg class="lg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nagybani Gastro">'+
  '<circle class="ring" cx="250" cy="250" r="226" fill="none" stroke="#5a9a32" stroke-width="7" stroke-linecap="round" transform="rotate(-105 250 250)"/>'+
  '<circle class="ring2" cx="250" cy="250" r="213" fill="none" stroke="#8cc63f" stroke-width="2.5" stroke-linecap="round" transform="rotate(75 250 250)"/>'+
  /* petrezselyem a háttérben */
  '<g class="veg" style="animation-delay:.9s"><ellipse cx="96" cy="170" rx="14" ry="30" fill="#2e7d32" transform="rotate(-35 96 170)"/><ellipse cx="116" cy="150" rx="12" ry="26" fill="#43a047" transform="rotate(-10 116 150)"/></g>'+
  '<g class="veg" style="animation-delay:.95s"><ellipse cx="258" cy="168" rx="12" ry="28" fill="#43a047" transform="rotate(30 258 168)"/><ellipse cx="274" cy="186" rx="10" ry="24" fill="#2e7d32" transform="rotate(55 274 186)"/></g>'+
  /* saláta */
  '<g class="veg" style="animation-delay:.7s"><circle cx="178" cy="140" r="32" fill="#9ccc65"/><circle cx="170" cy="136" r="22" fill="#7cb342"/><circle cx="186" cy="132" r="16" fill="#aed581"/></g>'+
  /* uborka */
  '<g class="veg" style="animation-delay:.8s"><ellipse cx="236" cy="188" rx="11" ry="32" fill="#2e7d32" transform="rotate(32 236 188)"/><ellipse cx="233" cy="186" rx="4" ry="26" fill="#66bb6a" transform="rotate(32 233 186)"/></g>'+

const $ = id => document.getElementById(id);
function sget(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function sset(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function jget(k,d){ try{ const v=JSON.parse(sget(k)); return v==null?d:v; }catch(e){ return d; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return (Number(n)||0).toLocaleString('hu-HU')+' Ft'; }
function uid(){ return 'i_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function dist(a,b,c,d){ const R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r; const h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2; return 2*R*Math.atan2(Math.sqrt(h),Math.sqrt(1-h)); }
const EMOJI=[['sárgarépa','🥕'],['répa','🥕'],['paradicsom','🍅'],['uborka','🥒'],['cukkini','🥒'],['saláta','🥬'],['spenót','🥬'],['káposzta','🥬'],['kel','🥬'],['paprika','🫑'],['burgonya','🥔'],['krumpli','🥔'],['fokhagyma','🧄'],['hagyma','🧅'],['alma','🍎'],['körte','🍐'],['banán','🍌'],['citrom','🍋'],['narancs','🍊'],['szőlő','🍇'],['gomba','🍄'],['kukorica','🌽'],['brokkoli','🥦'],['karfiol','🥦'],['padlizsán','🍆'],['eper','🍓'],['görögdinnye','🍉'],['dinnye','🍈'],['petrezselyem','🌿'],['zeller','🌿'],['kapor','🌿'],['bazsalikom','🌿'],['menta','🌿'],['tök','🎃'],['retek','🔴'],['cékla','🟣'],['barack','🍑'],['cseresznye','🍒'],['avokádó','🥑'],['bogyó','🫐'],['málna','🍓']];
function emojiFor(n){ n=String(n||'').toLowerCase(); for(const [k,e] of EMOJI) if(n.indexOf(k)>=0) return e; return '📦'; }

const LS={items:'nb_items',role:'nb_role',dev:'nb_dev',geo:'nb_geo'};
const PLACES={
  market:{name:'Nagybani Piac',sub:'Nagykőrösi út, Budapest',lat:47.414838,lng:19.168016,zoom:19},
  rezeda:{name:'Rezeda utca 4.',sub:'1204 Budapest (teszt)',query:'Rezeda utca 4, 1204 Budapest',lat:47.4375,lng:19.1120,zoom:19,approx:true},
  kalman:{name:'Kálmán Imre utca 20.',sub:'1054 Budapest (teszt)',query:'Kálmán Imre utca 20, 1054 Budapest',lat:47.50689,lng:19.05375,zoom:19,approx:true}
};
const geoCache=jget(LS.geo,{});
Object.keys(geoCache).forEach(k=>{ if(PLACES[k]){ PLACES[k].lat=geoCache[k].lat; PLACES[k].lng=geoCache[k].lng; PLACES[k].approx=false; } });

let items=jget(LS.items,[]);
let dev=Object.assign({dayOffset:0,virtual:false,radius:20,place:'market'},jget(LS.dev,{}));
if(!PLACES[dev.place]) dev.place='market';
let role=sget(LS.role);
let map,meMarker=null,meCircle=null,realLL=null,realAcc=0,virtLL=null,lastAdded=null,selectedId=null,curCollect=null,histFilter='all';
let markers={},snooze={};
const BOUND=0.006;

function saveItems(){
  if(sset(LS.items,JSON.stringify(items))) return true;
  items.forEach(i=>{ if(i.photo && i.date!==today()) i.photo=null; });
  if(sset(LS.items,JSON.stringify(items))) return true;
  toast('⚠️ Nincs elég tárhely – a fotók nem mentődtek'); items.forEach(i=>i.photo=null); sset(LS.items,JSON.stringify(items)); return false;
}
function saveDev(){ sset(LS.dev,JSON.stringify(dev)); }
function today(){ const d=new Date(Date.now()+dev.dayOffset*864e5); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function visible(){ const t=today(); return items.filter(i=>i.date===t && i.place===dev.place); }
function timeStr(ts){ return new Date(ts).toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'}); }

let toastT;
function toast(msg,ms){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),ms||3000); }

/* ====== TÉRKÉP ====== */
function boundsFor(p){ return [[p.lat-BOUND,p.lng-BOUND],[p.lat+BOUND,p.lng+BOUND]]; }
function initMap(){
  const p=PLACES[dev.place];
  map=L.map('map',{center:[p.lat,p.lng],zoom:p.zoom,minZoom:16,maxZoom:21,zoomControl:false,maxBounds:boundsFor(p),maxBoundsViscosity:1});
  const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:19,maxZoom:21,attribution:'Kép: Esri, Maxar, Earthstar Geographics'}).addTo(map);
  const st=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxNativeZoom:19,maxZoom:21,attribution:'© OpenStreetMap közreműködők'});
  L.control.layers({'Műhold':sat,'Térkép':st},null,{position:'topright'}).addTo(map);
  map.on('click',e=>{ if(dev.virtual){ virtLL={lat:e.latlng.lat,lng:e.latlng.lng}; updateMe(); checkNearby(); } });
  if(!virtLL) virtLL={lat:p.lat,lng:p.lng};
}

function setPlace(key,geocode){
  dev.place=key; saveDev();
  const p=PLACES[key];
  map.setMaxBounds(boundsFor(p));
  map.setView([p.lat,p.lng],p.zoom);
  virtLL={lat:p.lat,lng:p.lng};
  selectedId=null; closeSheet(true);
  renderMarkers(); updateMe();
  if(geocode && p.query && p.approx) geocodePlace(key);
}
function geocodePlace(key){
  const p=PLACES[key];
  toast('📍 Cím keresése…',2000);
  fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(p.query),{headers:{'Accept':'application/json'}})
    .then(r=>r.json()).then(j=>{
      if(!j||!j[0]) throw new Error('nincs találat');
      p.lat=parseFloat(j[0].lat); p.lng=parseFloat(j[0].lon); p.approx=false;
      geoCache[key]={lat:p.lat,lng:p.lng}; sset(LS.geo,JSON.stringify(geoCache));
      toast('✓ Cím pontosítva: '+p.name);
      if(dev.place===key) setPlace(key,false);
    }).catch(()=>toast('Címkeresés nem sikerült – közelítő hely marad',4000));
}

/* ====== KÉK PÖTTY ====== */
function myLL(){ return dev.virtual?virtLL:realLL; }
function inBounds(ll){ const p=PLACES[dev.place]; return ll && Math.abs(ll.lat-p.lat)<=BOUND && Math.abs(ll.lng-p.lng)<=BOUND; }
function updateMe(){
  const ll=myLL();
  const ok=ll && (dev.virtual || inBounds(ll));
  if(!ok){ if(meMarker){ map.removeLayer(meMarker); meMarker=null; } if(meCircle){ map.removeLayer(meCircle); meCircle=null; } return; }
  if(meMarker && (!!meMarker.options.draggable)!==dev.virtual){ map.removeLayer(meMarker); meMarker=null; }
  if(!meMarker){
    meMarker=L.marker([ll.lat,ll.lng],{draggable:dev.virtual,zIndexOffset:2000,icon:L.divIcon({className:'me-ico',iconSize:[44,44],iconAnchor:[22,22],html:'<div class="me'+(dev.virtual?' virt':'')+'"><i class="pulse"></i><i class="pulse p2"></i><i class="dot"></i></div>'})}).addTo(map);
    meMarker.on('drag',e=>{ const q=e.target.getLatLng(); virtLL={lat:q.lat,lng:q.lng}; });
    meMarker.on('dragend',()=>{ checkNearby(); });
  } else meMarker.setLatLng([ll.lat,ll.lng]);
  if(!dev.virtual && realAcc){
    if(!meCircle) meCircle=L.circle([ll.lat,ll.lng],{radius:realAcc,color:'#1a73e8',weight:1,opacity:.4,fillColor:'#1a73e8',fillOpacity:.13,interactive:false}).addTo(map);
    else meCircle.setLatLng([ll.lat,ll.lng]).setRadius(realAcc);
  } else if(meCircle){ map.removeLayer(meCircle); meCircle=null; }
}
function startGps(){
  if(!navigator.geolocation){ toast('A böngésző nem támogatja a helymeghatározást.',5000); return; }
  if(window.isSecureContext===false){ toast('A GPS csak https címen működik – használd a fejlesztői virtuális helyet.',6000); return; }
  navigator.geolocation.watchPosition(pos=>{
    realLL={lat:pos.coords.latitude,lng:pos.coords.longitude}; realAcc=pos.coords.accuracy||0;
    updateMe(); checkNearby();
  },err=>{
    if(err.code===1) toast('A helymeghatározás tiltva. Engedélyezd a böngészőben.',7000);
  },{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
}
$('locBtn').onclick=()=>{
  const ll=myLL();
  if(ll && (dev.virtual||inBounds(ll))) map.setView([ll.lat,ll.lng],Math.max(map.getZoom(),19),{animate:true});
  else { const p=PLACES[dev.place]; map.setView([p.lat,p.lng],p.zoom); toast('Nincs helyzet ezen a területen – bekapcsolható a virtuális hely (Fejlesztői).',4500); }
};

/* ====== TŰK ====== */
function pinIcon(it){
  const cls='pin'+(it.collected?' done':'')+(it.id===lastAdded?' drop':'')+(it.id===selectedId?' sel':'');
  return L.divIcon({className:'stand-ico',iconSize:[44,48],iconAnchor:[22,48],
    html:'<div class="'+cls+'"><div class="lbl">'+esc(it.name)+' · '+fmt(it.amount).replace(' Ft',' Ft')+'</div><div class="bub"><span>'+emojiFor(it.name)+'</span></div></div>'});
}
function renderMarkers(){
  if(!map) return;
  Object.values(markers).forEach(m=>map.removeLayer(m)); markers={};
  const list=visible();
  list.forEach(it=>{
    if(role==='collector' && it.collected) return;
    const m=L.marker([it.lat,it.lng],{icon:pinIcon(it),zIndexOffset:it.id===selectedId?800:100}).addTo(map);
    m.on('click',()=>{ selectedId=it.id; renderMarkers(); role==='collector'?openCollect(it.id,false):openDetail(it.id); });
    markers[it.id]=m;
  });
  lastAdded=null;
  renderHud();
}
function renderHud(){
  const list=visible(), open=list.filter(i=>!i.collected);
  const sum=list.reduce((a,i)=>a+(Number(i.amount)||0),0);
  const h=$('hud');
  if(!role){ h.style.display='none'; return; }
  h.style.display='block';
  if(role==='shopper') h.innerHTML='Ma: '+list.length+' tétel · '+fmt(sum)+'<small>'+open.length+' még nincs begyűjtve</small>';
  else h.innerHTML='Begyűjtendő: '+open.length+' / '+list.length+' tű<small>'+fmt(open.reduce((a,i)=>a+(Number(i.amount)||0),0))+' értékben</small>';
  $('colChip').innerHTML=open.length?('📍 '+open.length+' tű vár rád'):'✅ Minden begyűjtve';
}

function openSheet(html,cls,backdrop){

function closeSheet(silent){

function sheetBusy(){ return $('sheet').classList.contains('open') || $('page').classList.contains('open') || $('picker').classList.contains('on'); }
$('bd').onclick=()=>closeSheet();
document.addEventListener('click',e=>{ if(e.target.classList&&e.target.classList.contains('grab')) closeSheet(); });

function stands(){ const s={}; items.forEach(i=>{ if(i.stand) s[i.stand]=1; }); return Object.keys(s); }

  };

    const ll=myLL(); let lat,lng;

    else { const c=map.getCenter(); lat=c.lat; lng=c.lng; setTimeout(()=>toast('Nincs érvényes helyzet – a térkép közepére tettem a tűt.',4500),700); }
    const it={id:uid(),name,amount,paid,stand:$('fStand').value.trim(),note:$('fNote').value.trim(),photo:draftPhoto,lat,lng,place:dev.place,date:today(),ts:Date.now(),collected:false};

function compress(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{ const im=new Image(); im.onload=()=>{ const m=720,s=Math.min(1,m/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.6)); }; im.onerror=()=>res(null); im.src=r.result; };
    r.onerror=()=>res(null); r.readAsDataURL(file);
  });
}
function itemBody(it){
  return '<div class="row"><div class="big">'+emojiFor(it.name)+'</div><div style="flex:1;min-width:0"><div class="ttl">'+esc(it.name)+' · '+fmt(it.amount)+'</div>'+

    (it.note?'<div class="sub" style="margin:-2px 0 10px">📝 '+esc(it.note)+'</div>':'')+
    (it.photo?'<img class="thumb" src="'+it.photo+'">':'');
}

/* --- beszerző: begyűjtés --- */
function openCollect(id,auto,d){
  const it=items.find(i=>i.id===id); if(!it) return;
  curCollect=id; selectedId=id;
  openSheet('<h3>Begyűjtötted ezt?'+(auto&&d!=null?' <span style="font-size:13px;color:#5e7a5f;font-weight:700">· kb. '+Math.round(d)+' m-re vagy</span>':'')+'</h3>'+itemBody(it)+
    '<div class="btns"><button class="btn ghost" id="cLater">Később</button><button class="btn go" id="cYes">Igen, megvan ✓</button></div>','quarter',false);
  $('cLater').onclick=()=>closeSheet();
  $('cYes').onclick=()=>collect(id);
  if(auto && navigator.vibrate) navigator.vibrate([80,60,80]);
}
function collect(id){
  const it=items.find(i=>i.id===id); if(!it) return;
  it.collected=true; it.collectedTs=Date.now(); saveItems();
  curCollect=null; confetti(); closeSheet(true); renderMarkers();
  toast('✅ Begyűjtve: '+it.name);
  if(navigator.vibrate) navigator.vibrate(60);
}
function confetti(){
  const em=['🍃','🌿','🥬','🍀','🌱'];
  for(let i=0;i<18;i++){
    const s=document.createElement('span'); s.className='leaf'; s.textContent=em[i%em.length];
    s.style.setProperty('--dx',((Math.random()-.5)*340)+'px'); s.style.setProperty('--dy',(-(140+Math.random()*320))+'px'); s.style.setProperty('--rot',((Math.random()-.5)*720)+'deg');
    s.style.animationDelay=(Math.random()*.15)+'s'; document.body.appendChild(s); setTimeout(()=>s.remove(),1700);
  }
}

/* --- bevásárló: részletek --- */
function openDetail(id){
  const it=items.find(i=>i.id===id); if(!it) return;
  openSheet('<h3>Tű részletei</h3>'+itemBody(it)+
    '<div class="sub" style="margin-bottom:10px">🕒 '+timeStr(it.ts)+(it.collected?' · <span class="badge b-ok">Begyűjtve '+timeStr(it.collectedTs)+'</span>':' · <span class="badge b-no">Még nincs begyűjtve</span>')+'</div>'+
    '<div class="btns"><button class="btn red" id="dDel">Törlés</button><button class="btn ghost" id="dClose">Bezár</button></div>','quarter',true);
  let armed=false;
  $('dClose').onclick=()=>closeSheet();
  $('dDel').onclick=()=>{ if(!armed){ armed=true; $('dDel').textContent='Biztosan törlöd?'; return; } items=items.filter(i=>i.id!==id); saveItems(); closeSheet(); toast('Tű törölve.'); };
}

/* --- közelség figyelés --- */
function checkNearby(){
  if(role!=='collector' || sheetBusy()) return;
  const ll=myLL(); if(!ll) return;
  const now=Date.now(); let best=null,bd=1e9;
  visible().forEach(it=>{
    if(it.collected || (snooze[it.id]||0)>now) return;
    const d=dist(ll.lat,ll.lng,it.lat,it.lng);
    if(d<=dev.radius && d<bd){ best=it; bd=d; }
  });
  if(best) openCollect(best.id,true,bd);
}
setInterval(checkNearby,4000);
let lastDay=null;
setInterval(()=>{ const t=today(); if(lastDay && t!==lastDay){ renderMarkers(); toast('🌙 Új nap – a tegnapi tűk az Előzményekbe kerültek.',5000); } lastDay=t; },15000);

/* ====== OLDALAK ====== */
function openPage(title,build){
  $('pageT').textContent=title; $('page').classList.add('open'); $('menu').classList.remove('on'); closeSheet(true); build();
}
function closePage(){ $('page').classList.remove('open'); renderMarkers(); }
$('pageX').onclick=closePage;

function countUp(root){
  root.querySelectorAll('[data-count]').forEach(el=>{
    const to=Number(el.dataset.count)||0, t0=performance.now(), dur=700;
    (function step(t){ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=fmt(Math.round(to*e)); if(k<1) requestAnimationFrame(step); })(t0);
  });
}
function fmtDay(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('hu-HU',{month:'long',day:'numeric',weekday:'long'}); }
function renderHistory(keepScroll){
  const body=$('pageBody'), st=body.scrollTop;
  const days={}; items.forEach(i=>{ (days[i.date]=days[i.date]||[]).push(i); });
  const keys=Object.keys(days).sort().reverse();
  let h='<div class="chips"><button class="chp'+(histFilter==='all'?' on':'')+'" data-f="all">Mind</button><button class="chp'+(histFilter==='open'?' on':'')+'" data-f="open">Nincs begyűjtve</button></div>';
  let shown=0;
  keys.forEach((k,di)=>{
    let list=days[k].slice().sort((a,b)=>b.ts-a.ts);
    if(histFilter==='open') list=list.filter(i=>!i.collected);
    if(!list.length) return; shown++;
    const sum=list.reduce((a,i)=>a+(Number(i.amount)||0),0), got=list.filter(i=>i.collected).length;
    h+='<div class="day" style="animation-delay:'+(di*60)+'ms"><div class="dayH"><div>'+esc(fmtDay(k))+(k===today()?' · ma':'')+'<small>'+list.length+' tétel · '+got+' begyűjtve</small></div><div class="sum" data-count="'+sum+'">'+fmt(sum)+'</div></div>';
    list.forEach(i=>{
      h+='<div class="it"><div class="em">'+emojiFor(i.name)+'</div><div class="mid"><b>'+esc(i.name)+' · '+fmt(i.amount)+'</b><span>'+(i.stand?esc(i.stand)+' · ':'')+timeStr(i.ts)+(i.place!=='market'?' · teszt':'')+(i.paid?'':' · nincs kifizetve')+(i.note?' · '+esc(i.note):'')+'</span><div style="margin-top:5px">'+
        (i.collected?'<span class="badge b-ok">✓ Begyűjtve '+timeStr(i.collectedTs)+'</span>':'<span class="badge b-bad">✗ Nincs begyűjtve</span>')+'</div></div>'+
        '<button class="mk" data-id="'+i.id+'">'+(i.collected?'Visszavon':'Begyűjtve ✓')+'</button></div>';
    });
    h+='</div>';
  });
  if(!shown) h+='<div class="empty">🌱 Még nincs rögzített tétel.</div>';
  body.innerHTML=h;
  body.querySelectorAll('.chp').forEach(b=>b.onclick=()=>{ histFilter=b.dataset.f; renderHistory(); });
  body.querySelectorAll('.mk').forEach(b=>b.onclick=()=>{ const it=items.find(x=>x.id===b.dataset.id); if(!it) return; it.collected=!it.collected; it.collectedTs=it.collected?Date.now():null; saveItems(); renderHistory(true); });
  if(keepScroll) body.scrollTop=st; else countUp(body);
}
function openHistory(){ openPage('🕘 Előzmények',()=>{ $('pageBody').scrollTop=0; renderHistory(); }); }

function renderDev(){
  const body=$('pageBody'), st=body.scrollTop, ll=myLL(), p=PLACES[dev.place];
  let h='<div class="card"><h4>Teszttérkép</h4>';
  Object.keys(PLACES).forEach(k=>{ const q=PLACES[k]; h+='<button class="plc'+(dev.place===k?' on':'')+'" data-p="'+k+'">'+esc(q.name)+'<small>'+esc(q.sub)+(q.approx?' · közelítő hely – koppints a pontosításhoz':'')+'</small></button>'; });
  h+='</div><div class="card"><h4>Helyzet</h4><div class="sw" id="dVirt"><span>🟣 Virtuális hely (húzható kék pötty)</span><div class="tg'+(dev.virtual?' on':'')+'"></div></div>'+
    '<div class="sub">Bekapcsolva a pöttyöt ujjal húzhatod, vagy a térképre koppintva áthelyezheted – így gyaloglás nélkül kipróbálható a begyűjtés.</div>'+
    '<div style="margin-top:14px;font-weight:800;color:var(--g1)">Közelségi sugár: <span id="rv">'+dev.radius+'</span> m</div><input type="range" id="dRad" min="10" max="60" step="5" value="'+dev.radius+'"></div>'+
    '<div class="card"><h4>Eszközök</h4><div class="btns" style="flex-wrap:wrap"><button class="btn ghost" id="dDemo" style="flex:1 1 45%">🧪 5 demó tű</button><button class="btn ghost" id="dDay" style="flex:1 1 45%">🌙 Éjfél +1 nap</button></div>'+
    '<div class="btns"><button class="btn ghost" id="dDay0">↩ Nap visszaállítása</button><button class="btn red" id="dClr">🗑 Összes adat törlése</button></div>'+
    '<div class="sub" style="margin-top:10px">Szimulált nap eltolás: <b>+'+dev.dayOffset+'</b> · mai dátum az appban: <b>'+today()+'</b></div></div>'+
    '<div class="card"><h4>Információ</h4><div class="mono">Terület: '+esc(p.name)+'<br>Közép: '+p.lat.toFixed(6)+', '+p.lng.toFixed(6)+'<br>Pötty: '+(ll?ll.lat.toFixed(6)+', '+ll.lng.toFixed(6):'nincs')+(!dev.virtual&&realAcc?' (±'+Math.round(realAcc)+' m)':'')+'<br>Tételek összesen: '+items.length+' · ma itt: '+visible().length+'<br>Szerep: '+esc(role||'-')+'</div></div>';
  body.innerHTML=h;
  body.querySelectorAll('.plc').forEach(b=>b.onclick=()=>{ const k=b.dataset.p; if(dev.place===k && PLACES[k].approx && PLACES[k].query){ geocodePlace(k); return; } setPlace(k,true); renderDev(); });
  $('dVirt').onclick=()=>{ dev.virtual=!dev.virtual; if(dev.virtual && !virtLL) virtLL={lat:PLACES[dev.place].lat,lng:PLACES[dev.place].lng}; saveDev(); updateMe(); renderDev(); toast(dev.virtual?'Virtuális hely bekapcsolva':'Valódi GPS'); };
  $('dRad').oninput=e=>{ dev.radius=Number(e.target.value); $('rv').textContent=dev.radius; saveDev(); };
  $('dDemo').onclick=()=>{
    const c=map.getCenter(), N=[['répa',3200,'Kovács Józsi'],['paradicsom',5400,'Szabó Mari'],['saláta',1800,'Zöld Kert'],['paprika',4200,'Nagy Pál'],['uborka',2600,'Kovács Józsi']];
    N.forEach((n,i)=>{ items.push({id:uid(),name:n[0],amount:n[1],paid:i!==3,stand:n[2],note:i===1?'2 láda, hátul':'',photo:null,lat:c.lat+(Math.random()-.5)*.0006,lng:c.lng+(Math.random()-.5)*.0009,place:dev.place,date:today(),ts:Date.now()-i*600000,collected:false}); });
    saveItems(); renderDev(); toast('5 demó tű lerakva a térkép közepe körül');
  };
  $('dDay').onclick=()=>{ dev.dayOffset++; saveDev(); renderMarkers(); renderDev(); toast('🌙 Éjfél elmúlt – a mai tűk eltűntek a térképről.'); };
  $('dDay0').onclick=()=>{ dev.dayOffset=0; saveDev(); renderMarkers(); renderDev(); };
  let armed=false;
  $('dClr').onclick=()=>{ if(!armed){ armed=true; $('dClr').textContent='Biztosan? Még egyszer'; return; } items=[]; saveItems(); renderMarkers(); renderDev(); toast('Minden adat törölve.'); };
  body.scrollTop=st;
}
function openDev(){ openPage('🛠 Fejlesztői',()=>{ $('pageBody').scrollTop=0; renderDev(); }); }

/* ====== MENÜ + SZEREP ====== */
$('menuBtn').onclick=e=>{ e.stopPropagation(); $('menu').classList.toggle('on'); };
document.addEventListener('click',e=>{ if(!e.target.closest('#menu') && e.target.id!=='menuBtn') $('menu').classList.remove('on'); });
$('menu').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return; $('menu').classList.remove('on');
  if(b.dataset.m==='hist') openHistory(); else if(b.dataset.m==='dev') openDev(); else if(b.dataset.m==='role') showPicker();
};
function showPicker(){ $('pickerLogo').innerHTML=logoSVG(); $('picker').classList.add('on'); closeSheet(true); }
function setRole(r){
  role=r; sset(LS.role,r);
  document.body.classList.remove('shopper','collector'); document.body.classList.add(r);
  $('roleChip').innerHTML=r==='shopper'?'🧺 Bevásárló':'🚚 Beszerző';
  $('picker').classList.remove('on');
  renderMarkers(); snooze={};
}
document.querySelectorAll('.role').forEach(b=>b.onclick=()=>setRole(b.dataset.r));
$('fab').onclick=openAdd;
$('colChip').onclick=openHistory;

/* ====== INDÍTÁS ====== */
function boot(){
  $('splashLogo').innerHTML=logoSVG();
  initMap(); renderHud(); lastDay=today();
  if(role) setRole(role); else { $('roleChip').textContent=''; }
  startGps(); updateMe();
  setTimeout(()=>{
    $('splash').classList.add('out'); setTimeout(()=>$('splash').remove(),700);
    if(!role) showPicker();
  },3400);
}
window.addEventListener('load',boot);
})();
</script>
</body>
</html>
