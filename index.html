<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#123517">
<title>Nagybani Beszerzés</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
/* Tervezési irány: piaci cédula / árcímke. Kemény, lapos árnyék, árcímke-sárga akció, szerif cím + keskeny számok. */
:root{
  --ink:#0d2812;--forest:#164a1b;--leaf:#4f9a2f;--lime:#b9e24b;--sticker:#ffd23f;--stickerD:#b88f00;
  --paper:#f6f8f1;--line:#dfe6d4;--mute:#587058;--tomato:#e5493a;--blue:#1a73e8;
  --serif:Georgia,"Noto Serif","Times New Roman",serif;
  --cond:"Roboto Condensed","Arial Narrow","sans-serif-condensed",system-ui,sans-serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --hard:0 3px 0 rgba(13,40,18,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--forest);font-family:var(--sans);color:var(--ink);touch-action:manipulation}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sticker);outline-offset:2px}
#map{position:absolute;inset:0;z-index:0}
.leaflet-container{background:#1d2a1d}
.n{font-family:var(--cond);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.2px}

/* ===== fejléc ===== */
#hdr{position:fixed;top:0;left:0;right:0;z-index:800;padding:calc(10px + var(--sat)) 12px 8px;display:flex;align-items:center;gap:8px;pointer-events:none}
#hdr>*{pointer-events:auto}
.pill{background:var(--paper);border-radius:14px;box-shadow:var(--hard);height:44px;display:flex;align-items:center}
.brand{padding:0 12px}
.brand img{height:28px;width:auto;display:block}
#roleChip{margin-left:auto;background:rgba(13,40,18,.62);color:#fff;padding:0 12px;font-weight:600;font-size:12px;height:32px;border-radius:16px;box-shadow:none;display:none;white-space:nowrap;gap:6px}
#optBtn{position:relative;border:none;padding:0 14px;font-weight:700;font-size:14px;color:var(--ink);white-space:nowrap}
#optBtn::after{content:'';position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:#b9b9b9;border:2px solid var(--paper)}
#optBtn.sy-on::after{background:#3fae2a}
#optBtn.sy-off::after{background:#e8a317}
body.shopper #roleChip,body.collector #roleChip{display:flex}
body:not(.shopper):not(.collector) #optBtn{margin-left:auto}

/* ===== cédula (HUD) ===== */
#hud{position:fixed;top:calc(62px + var(--sat));left:12px;right:12px;z-index:700;display:none;gap:8px;align-items:flex-start}
#hudMain{flex:1;min-width:0;border:none;background:var(--paper);color:var(--ink);text-align:left;padding:10px 14px 20px;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;
  display:flex;align-items:center;gap:10px;border-radius:12px 12px 0 0}
#hudWrap{flex:1;min-width:0;display:flex;filter:drop-shadow(0 3px 0 rgba(13,40,18,.55))}
#hudMain .tk{flex:1;min-width:0}
#hudMain small{display:block;font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hudMain b{display:block;font:700 26px/1.05 var(--cond);font-variant-numeric:tabular-nums}
#hudMain .chev{font-size:24px;color:var(--leaf);font-weight:900}
#hudClose{display:none;border:2px solid var(--forest);border-radius:14px;background:var(--paper);color:var(--forest);font-weight:800;font-size:14px;line-height:1.15;padding:0 14px;height:54px;box-shadow:0 4px 0 rgba(13,40,18,.55);text-align:center}
#hudClose.shut{background:var(--lime);border-color:#6d9a14;box-shadow:0 4px 0 #6d9a14}
#hudClose:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(13,40,18,.55)}
body.shopper #hudClose{display:block}

/* ===== alsó sáv ===== */
#dock{position:fixed;left:0;right:0;bottom:calc(14px + var(--sab));z-index:700;display:none;justify-content:center;align-items:stretch;gap:10px;padding:0 12px}
body.shopper #dock{display:flex}
.side{width:98px;height:68px;border:none;border-radius:18px;background:var(--paper);box-shadow:var(--hard);font-weight:700;font-size:12px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex:none;line-height:1.1;text-align:center;padding:0 2px;white-space:nowrap}
.side svg{width:24px;height:24px}
.side:active{transform:translateY(3px);box-shadow:0 0 0 rgba(13,40,18,.55)}
#fab{flex:1;max-width:220px;height:68px;border:none;border-radius:20px;background:var(--sticker);color:var(--ink);font:800 18px/1.1 var(--sans);box-shadow:0 5px 0 var(--stickerD),0 10px 24px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;gap:10px;padding:0 12px;transform:rotate(-1.2deg)}
#fab svg{width:30px;height:30px;flex:none}
#fab:active{transform:translateY(4px) rotate(-1.2deg);box-shadow:0 1px 0 var(--stickerD)}
#colChip{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%);z-index:700;display:none;border:none;background:var(--paper);box-shadow:var(--hard);border-radius:18px;padding:16px 24px;font-weight:800;font-size:16px;color:var(--ink);white-space:nowrap}
body.collector #colChip{display:block}
#locBtn{position:fixed;right:14px;bottom:calc(100px + var(--sab));z-index:700;width:52px;height:52px;border-radius:50%;border:none;background:var(--paper);box-shadow:var(--hard);display:flex;align-items:center;justify-content:center}
#locBtn svg{width:26px;height:26px}
body.collector #locBtn{bottom:calc(92px + var(--sab))}
#manBar{position:fixed;left:12px;right:12px;bottom:calc(14px + var(--sab));z-index:760;display:none;background:var(--paper);border-radius:20px;box-shadow:var(--hard);padding:14px;text-align:center;font-weight:700}
#manBar.on{display:block}
#manBar .btns{margin-top:10px}

/* ===== kék pötty + irány ===== */
.me-ico{background:none;border:none}
.me{position:relative;width:44px;height:44px}
.me .pulse{position:absolute;inset:0;border-radius:50%;background:rgba(26,115,232,.3);animation:pulse 2.4s ease-out infinite}
.me .pulse.p2{animation-delay:1.2s}
.me .cw{position:absolute;inset:0;display:none;will-change:transform}
.me.hasH .cw{display:block}
.me .cone{position:absolute;left:50%;bottom:50%;width:96px;height:84px;margin-left:-48px;clip-path:polygon(50% 100%,0 0,100% 0);background:linear-gradient(to top,rgba(26,115,232,.8),rgba(26,115,232,0))}
.me .dot{position:absolute;left:12px;top:12px;width:20px;height:20px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 2px 8px rgba(0,0,0,.5)}
.me.virt .dot{background:#7c4dff}
.me.virt .pulse{background:rgba(124,77,255,.3)}

/* ===== tűk: árcímkék ===== */
.stand-ico{background:none;border:none}
.tg{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;display:flex;flex-direction:column;align-items:center}
.tag{display:flex;align-items:stretch;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 3px 0 rgba(13,40,18,.7),0 6px 14px rgba(0,0,0,.35);border:2px solid var(--forest);max-width:200px}
.tag .e{display:flex;align-items:center;padding:0 7px;font-size:20px;background:#eef5e4}
.tag .t{padding:4px 8px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.tag .t b{font:800 13px/1.1 var(--sans);overflow:hidden;text-overflow:ellipsis;max-width:92px}
.tag .t i{font:700 12px/1.1 var(--cond);font-style:normal;color:var(--mute)}
.tag strong{background:var(--sticker);padding:0 8px;display:flex;align-items:center;font:700 17px/1 var(--cond);font-variant-numeric:tabular-nums}
.tg .ln{width:2px;background:var(--forest);margin-top:-1px}
.tg .stem{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:10px solid var(--forest);margin-top:-1px}
.tg .pt{width:12px;height:12px;border-radius:50%;background:var(--forest);border:3px solid #fff;margin-top:-3px;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.tg.man .tag{border-color:#c86400}.tg.man .stem{border-top-color:#c86400}.tg.man .pt{background:#c86400}
.tg.sel .tag{box-shadow:0 0 0 4px rgba(255,210,63,.85),0 3px 0 rgba(13,40,18,.7)}
.tg.done{filter:grayscale(1);opacity:.6}
.tg.done .t b{text-decoration:line-through}
.tg.drop{animation:tagDrop .7s cubic-bezier(.3,1.5,.5,1) both}
.tg.drop .pt::after{content:"";position:absolute;left:-9px;top:-9px;width:24px;height:24px;border-radius:50%;border:3px solid var(--sticker);animation:ripple 1.1s .5s ease-out both}

/* ===== lap ===== */
#bd{position:fixed;inset:0;z-index:1100;background:rgba(5,20,8,.5);opacity:0;pointer-events:none;transition:opacity .3s}
#bd.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:1200;background:var(--paper);border-radius:26px 26px 0 0;box-shadow:0 -6px 0 var(--forest),0 -16px 40px rgba(0,0,0,.4);padding:10px 18px calc(20px + var(--sab));transform:translateY(110%);transition:transform .38s cubic-bezier(.2,1.1,.3,1);max-height:90vh;overflow-y:auto}
#sheet.open{transform:none}
#sheet.quarter{min-height:25vh}
.grab{width:46px;height:5px;border-radius:3px;background:#c3cfb8;margin:0 auto 12px}
#sheet h3{margin:0 0 12px;color:var(--forest);font:900 23px/1.15 var(--serif)}
.row{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.big{font-size:44px;line-height:1}
.ttl{font:800 19px/1.2 var(--sans)}
.sub{color:var(--mute);font-size:14px;margin-top:2px}
.badge{display:inline-block;padding:3px 10px;border-radius:8px;font-size:12px;font-weight:800;margin:2px 6px 2px 0}
.b-ok{background:#dcf2c4;color:#1b5e20}.b-no{background:#ffe3b0;color:#8a4b00}.b-bad{background:#ffd5d0;color:#a3261a}.b-dep{background:var(--wood);color:var(--woodD)}
.thumb{width:100%;max-height:150px;object-fit:cover;border-radius:12px;margin-bottom:12px}
.btns{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;border:none;border-radius:14px;padding:15px;font-weight:800;font-size:16px;color:var(--ink)}
.btn.go,.btn.amber{background:var(--sticker);box-shadow:0 4px 0 var(--stickerD)}
.btn.ghost{background:#e5ecdb;box-shadow:0 4px 0 #c3cfb8}
.btn.red{background:#ffd9d4;color:#a3261a;box-shadow:0 4px 0 #e6a8a1}
.btn:active{transform:translateY(3px);box-shadow:none}
label.f{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:0 0 4px 2px}
.in{width:100%;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 13px;font-size:17px;font-family:inherit;margin-bottom:12px;outline:none;transition:border-color .2s}
.in:focus{border-color:var(--leaf)}
textarea.in{min-height:64px;resize:none}
.two{display:flex;gap:10px}.two>div{flex:1;min-width:0}
.sw{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:12px;font-weight:700;user-select:none}
.tgl{position:relative;width:52px;height:30px;border-radius:15px;background:#c3cfb8;margin-left:auto;transition:background .25s;flex:none}
.tgl::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.35);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.tgl.on{background:var(--leaf)}.tgl.on::after{transform:translateX(22px)}
.photoBtn{display:flex;align-items:center;gap:10px;background:#fff;border:2px dashed #b3c6a3;border-radius:12px;padding:11px 13px;font-weight:700;margin-bottom:12px;width:100%;font-size:15px}
.photoBtn img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.chipRow{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.uc{border:none;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;background:#e5ecdb;color:var(--ink)}
.uc.on{background:var(--forest);color:#fff}
.dep{background:#faf3e6;border-radius:14px;padding:12px;margin-bottom:12px;border:2px solid #ead7b5}
.dep h5{margin:0 0 8px;color:var(--woodD);font-size:14px}
.stp{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:10px;padding:6px 10px;margin-bottom:6px;font-weight:700;gap:8px}
.stp .ctl{display:flex;gap:8px;align-items:center}
.stp button{width:40px;height:40px;border-radius:10px;border:none;background:#e5ecdb;font-size:22px;font-weight:900;color:var(--forest);line-height:1}
.stp output{min-width:28px;text-align:center;font:700 22px var(--cond)}
.stp input{border:none;background:none;font:700 15px var(--sans);flex:1;min-width:0;outline:none;padding:4px}

/* ===== menü ===== */
#menu{position:fixed;top:calc(58px + var(--sat));right:12px;z-index:1250;background:var(--paper);border-radius:16px;padding:6px;box-shadow:var(--hard),0 14px 40px rgba(0,0,0,.4);display:none;min-width:220px;transform-origin:top right}
#menu.on{display:block;animation:pop .22s cubic-bezier(.3,1.5,.5,1)}
#menu button{display:flex;gap:12px;align-items:center;width:100%;border:none;background:none;padding:14px 16px;font-size:16px;font-weight:700;color:var(--ink);border-radius:10px;text-align:left}
#menu button:active{background:#e5ecdb}

/* ===== oldal ===== */
#page{position:fixed;inset:0;z-index:1300;background:var(--paper);transform:translateY(100%);transition:transform .36s cubic-bezier(.2,1,.3,1);display:flex;flex-direction:column}
#page.open{transform:none}
#pageHd{display:flex;align-items:center;gap:10px;padding:calc(14px + var(--sat)) 16px 14px;background:var(--forest);color:#fff;border-bottom:5px solid var(--sticker)}
#pageHd h2{margin:0;font:900 23px/1.1 var(--serif);flex:1}
#pageX{width:42px;height:42px;border-radius:12px;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:20px}
#pageBody{flex:1;overflow-y:auto;padding:14px 14px calc(30px + var(--sab))}
.day{background:#fff;border-radius:14px;margin-bottom:14px;border:2px solid var(--line);overflow:hidden}
.dayH{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#eef5e4;font-weight:800;color:var(--forest);gap:8px}
.dayH small{display:block;font-weight:600;color:var(--mute);font-size:12px}
.dayH .sum{font:700 22px var(--cond);white-space:nowrap}
.it{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:2px dashed var(--line)}
.it:first-of-type{border-top:none}
.it .em{font-size:28px}
.it .mid{flex:1;min-width:0}
.it .mid b{display:block;font-size:16px}
.it .mid span.m{font-size:12px;color:var(--mute)}
.it .pr{font:700 20px var(--cond);white-space:nowrap}
.it .mk{border:none;border-radius:10px;padding:9px 11px;font-weight:800;font-size:12px;background:#e5ecdb;color:var(--ink)}
.it.tap{cursor:pointer}
.chips{display:flex;gap:8px;margin-bottom:14px}
.chp{border:none;border-radius:20px;padding:10px 16px;font-weight:700;background:#e5ecdb;color:var(--ink);font-size:14px}
.chp.on{background:var(--forest);color:#fff}
.empty{text-align:center;color:var(--mute);padding:40px 20px;font-weight:600;line-height:1.5}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;border:2px solid var(--line)}
.card h4{margin:0 0 10px;color:var(--forest);font:900 18px var(--serif)}
.plc{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;font-weight:700;color:var(--ink);font-size:15px}
.plc small{display:block;font-weight:500;color:var(--mute);margin-top:2px}
.plc.on{border-color:var(--leaf);background:#eef7e4}
.seg{display:flex;background:#e5ecdb;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:none;border-radius:11px;padding:12px 8px;font-weight:700;font-size:14px;background:none;color:var(--ink)}
.seg button.on{background:var(--forest);color:#fff}
.mono{font:12px/1.7 ui-monospace,Menlo,monospace;color:#3d5a40;word-break:break-all}
input[type=range]{width:100%;accent-color:var(--leaf)}
.sumRow{display:flex;gap:8px;margin-bottom:12px}
.sumBox{flex:1;background:#fff;border-radius:12px;padding:10px 6px;text-align:center;border:2px solid var(--line)}
.sumBox b{display:block;font:700 24px/1.1 var(--cond)}
.sumBox span{font-size:12px;color:var(--mute);font-weight:600}
.lr{display:flex;gap:12px;align-items:center;padding:11px 14px;border-top:2px dashed var(--line)}
.lr:first-child{border-top:none}
.ck{width:32px;height:32px;border-radius:10px;border:3px solid #a9bf98;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;padding:0}
.ck.on{background:var(--leaf);border-color:var(--leaf)}
.ck.auto{background:var(--forest);border-color:var(--forest)}
.lr .mid{flex:1;min-width:0}
.lr .mid b{display:block;font-size:16px}
.lr .mid small{color:var(--mute);font-size:12px;font-weight:600}
.lr.done .mid b{text-decoration:line-through;color:#7a907a}
.xb{border:none;background:none;font-size:18px;color:#9aa89a;padding:8px}
.bar{height:8px;background:#e5ecdb;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:4px;transition:width .6s}
.addGrid{display:grid;grid-template-columns:1.4fr .8fr .9fr;gap:8px}
.addGrid .in{margin-bottom:0}
.addr{display:flex;align-items:center;gap:12px;padding:14px;border-top:2px dashed var(--line);cursor:pointer}
.addr:first-child{border-top:none}
.addr .ad{flex:1;min-width:0}
.addr .ad b{display:block;font:900 18px var(--serif)}
.addr .ad small{color:var(--mute);font-weight:600;font-size:13px}
.addr .go{font-size:26px;color:var(--leaf);font-weight:900}
.back{border:none;background:#e5ecdb;border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px;margin-bottom:12px;color:var(--ink)}
.pv{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:2px dashed var(--line);font-weight:700;font-size:14px}
.pv span{flex:1}

/* ===== splash, picker, kész ===== */
#splash,#picker{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#splash{z-index:1600;background:#fff;transition:opacity .7s,transform .7s}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
#splashLogo{width:min(84vw,60vh,440px)}
#picker{z-index:1500;background:var(--forest) repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 2px,transparent 2px 46px);display:none;color:#fff;overflow-y:auto}
#picker.on{display:flex}
#pickerLogo{width:min(46vw,200px);height:auto;margin-bottom:14px;border-radius:50%;box-shadow:0 0 0 5px var(--sticker),0 14px 40px rgba(0,0,0,.5);animation:logoIn .7s cubic-bezier(.2,1.2,.3,1) both}
#picker h2{margin:10px 0 18px;font:900 28px/1.1 var(--serif);text-align:center}
.role{width:100%;max-width:380px;border:none;border-radius:18px;padding:18px 20px;margin:0 auto 14px;display:flex;gap:16px;align-items:center;text-align:left;background:var(--paper);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.45);animation:roleIn .6s cubic-bezier(.2,1.3,.4,1) both}
.role:nth-of-type(2){animation-delay:.12s}
.role svg{width:48px;height:48px;flex:none}
.role b{display:block;font:900 22px var(--serif)}
.role span{font-size:13px;color:var(--mute)}
.role:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
#done{position:fixed;inset:0;z-index:1700;background:var(--forest);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#done.on{display:flex;animation:fadeIn .25s both}
#done svg{width:130px;height:130px}
#done .c{stroke-dasharray:300;stroke-dashoffset:300;animation:draw .7s .1s forwards}
#done .k{stroke-dasharray:80;stroke-dashoffset:80;animation:draw .5s .65s forwards}
#done h2{font:900 32px var(--serif);margin:18px 0 6px;animation:fadeUp .5s .6s both}
#done p{margin:0;opacity:.9;animation:fadeUp .5s .8s both}
#toast{position:fixed;left:50%;top:calc(8px + var(--sat));transform:translate(-50%,-16px);z-index:1400;background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.2,1.3,.4,1);box-shadow:0 4px 0 rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.leaf{position:fixed;z-index:1450;font-size:26px;pointer-events:none;left:50%;bottom:20%;animation:leaf 1.4s cubic-bezier(.2,.8,.4,1) forwards}

/* ===== logó animáció (SVG) ===== */
.lg{width:100%;height:auto;display:block;overflow:visible}
.lg .ring{stroke-dasharray:1420;stroke-dashoffset:1420;animation:draw 1.7s .1s cubic-bezier(.6,0,.3,1) forwards}
.lg .ring2{stroke-dasharray:1340;stroke-dashoffset:1340;animation:draw 1.9s .5s cubic-bezier(.6,0,.3,1) forwards}
.lg .crate{opacity:0;animation:crateIn .6s .5s cubic-bezier(.3,1.5,.5,1) forwards;transform-box:fill-box;transform-origin:center bottom}
.lg .veg{opacity:0;transform-box:fill-box;transform-origin:center bottom;animation:vegIn .55s cubic-bezier(.3,1.9,.5,1) forwards}
.lg .truck{opacity:0;animation:truckIn 1s 1.1s cubic-bezier(.2,.9,.3,1) forwards}
.lg .spd{transform-box:fill-box;transform-origin:right center;animation:spd .5s 1.9s ease-in-out infinite alternate}
.lg .wheel{transform-box:fill-box;transform-origin:center;animation:spin .8s linear infinite}
.lg .t1,.lg .t2,.lg .t3{opacity:0;animation:fadeUp .7s forwards}
.lg .t1{animation-delay:1.3s}.lg .t2{animation-delay:1.55s}.lg .t3{animation-delay:1.8s}
.lg .leafA,.lg .leafB{transform-box:fill-box;transform-origin:left bottom;transform:scale(0);animation:grow .8s 2s cubic-bezier(.3,1.6,.5,1) forwards}
.lg .leafB{animation-delay:2.2s}

@keyframes draw{to{stroke-dashoffset:0}}
@keyframes crateIn{from{opacity:0;transform:translateY(-60px) scale(.8)}to{opacity:1;transform:none}}
@keyframes vegIn{from{opacity:0;transform:translateY(-90px) scale(.5)}to{opacity:1;transform:none}}
@keyframes truckIn{from{opacity:0;transform:translateX(150px)}to{opacity:1;transform:none}}
@keyframes spd{from{transform:scaleX(.55)}to{transform:scaleX(1.1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes grow{to{transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes logoIn{from{opacity:0;transform:scale(.7) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes pulse{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes tagDrop{0%{transform:translate(-50%,calc(-100% - 140px));opacity:0}55%{opacity:1}100%{transform:translate(-50%,-100%);opacity:1}}
@keyframes ripple{0%{transform:scale(.3);opacity:1}100%{transform:scale(3);opacity:0}}
@keyframes roleIn{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes leaf{0%{transform:translate(0,0) rotate(0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1.1);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.lg .ring,.lg .ring2{stroke-dashoffset:0}.lg .crate,.lg .veg,.lg .truck,.lg .t1,.lg .t2,.lg .t3{opacity:1}.lg .leafA,.lg .leafB{transform:none}}

/* ===== v1.7 ===== */
:root{--stamp:#c8281e;--wood:#f3e6cf;--woodD:#6b4513;--thermal:#fffef7}
body.pg #toast{top:auto;bottom:calc(22px + var(--sab));transform:translate(-50%,16px)}
body.pg #toast.on{transform:translate(-50%,0)}
.leaflet-tile-pane{filter:saturate(.78) brightness(.84) contrast(1.06)}
.tg.done{filter:grayscale(1);opacity:.45}
.tg .ln{width:2px;background:var(--forest);margin-top:-1px;box-shadow:0 0 0 1px rgba(255,255,255,.55)}
.tg .ln[style*="height:0"]{display:none}
@keyframes gun{0%{transform:translate(-50%,calc(-100% - 26px)) scale(1.35);opacity:0}45%{transform:translate(-50%,calc(-100% + 4px)) scale(.94);opacity:1}70%{transform:translate(-50%,calc(-100% - 2px)) scale(1.03)}100%{transform:translate(-50%,-100%) scale(1)}}
.tg.drop{animation:gun .38s cubic-bezier(.2,.9,.3,1) both;transform-origin:50% 100%}
/* blokk */
.rcpt{position:relative;background:var(--thermal);color:#1d241d;padding:20px 18px 26px;margin:2px 2px 16px;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50% 100%/14px 51% repeat-x,conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) 50% 0/14px 51% repeat-x;
  mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50% 100%/14px 51% repeat-x,conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) 50% 0/14px 51% repeat-x}
.rcptW{filter:drop-shadow(0 4px 0 rgba(13,40,18,.25)) drop-shadow(0 10px 18px rgba(0,0,0,.18))}
.rcpt .rh{text-align:center;padding-bottom:10px;border-bottom:2px dashed #c9ccc0;margin-bottom:6px}
.rcpt .rh b{display:block;font:900 22px/1 var(--serif);letter-spacing:.5px}
.rcpt .rh span{display:block;font:600 12px var(--cond);color:#6a7268;margin-top:5px}
.rl{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dotted #cfd2c6}
.rl .em{font-size:22px;line-height:1.1;width:26px;text-align:center;flex:none}
.rl .mid{flex:1;min-width:0}
.rl .mid b{display:block;font:700 15px/1.2 var(--sans)}
.rl .mid small{display:block;font:600 12px var(--cond);color:#6a7268;margin:2px 0 4px}
.rl .pr{font:700 18px var(--cond);white-space:nowrap;font-variant-numeric:tabular-nums}
.rl.tap{cursor:pointer}.rl.tap:active{background:#f1f3ea}
.rl.got .mid b{text-decoration:line-through;text-decoration-color:var(--leaf);text-decoration-thickness:2px}
.rs{display:flex;justify-content:space-between;font:600 14px var(--cond);color:#4d564c;padding:3px 0}
.rtot{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid #1d241d;border-bottom:5px double #1d241d;margin-top:10px;padding:8px 0 6px}
.rtot span{font:800 15px var(--sans)}
.rtot b{font:700 32px/1 var(--cond);font-variant-numeric:tabular-nums}
.rfoot{text-align:center;font:600 12px var(--cond);color:#6a7268;margin-top:12px}
.stampOK{display:inline-block;margin-top:10px;border:3px solid var(--leaf);color:var(--leaf);font:900 15px var(--sans);padding:4px 10px;border-radius:6px;transform:rotate(-4deg)}
/* kész képernyő */
#done{background:radial-gradient(120% 80% at 50% 0%,#1f5c24,var(--forest) 55%,#0f3513);justify-content:flex-start;padding:calc(24px + var(--sat)) 16px calc(18px + var(--sab));overflow:auto}
#done .roll{width:100%;max-width:380px;position:relative}
#done .slot{height:10px;border-radius:6px;background:#0b2a0f;box-shadow:inset 0 3px 4px rgba(0,0,0,.6);margin:0 -6px -4px;position:relative;z-index:2}
#done .clip{overflow:hidden;position:relative}
#done.on .rcptW{animation:rollOut 1.15s cubic-bezier(.25,.8,.3,1) both}
@keyframes rollOut{0%{transform:translateY(-100%)}100%{transform:translateY(0)}}
#done .rcpt{margin:0}
.stamp{position:absolute;left:50%;top:46%;z-index:3;transform:translate(-50%,-50%) rotate(-14deg);border:5px solid var(--stamp);color:var(--stamp);border-radius:10px;padding:6px 18px 8px;text-align:center;
  font:900 46px/1 var(--sans);letter-spacing:4px;opacity:.88;mix-blend-mode:multiply;pointer-events:none;
  -webkit-mask:radial-gradient(circle at 30% 40%,#000 60%,#0007 61%,#000 75%) ;}
.stamp small{display:block;font:800 13px/1.2 var(--sans);letter-spacing:2px;margin-top:4px}
#done.on .stamp{animation:slam .42s 1.2s cubic-bezier(.3,1.6,.5,1) both}
@keyframes slam{0%{transform:translate(-50%,-50%) rotate(-24deg) scale(2.6);opacity:0}60%{opacity:.95}100%{transform:translate(-50%,-50%) rotate(-14deg) scale(1);opacity:.88}}
#done.on .roll{animation:shake .3s 1.5s both}
@keyframes shake{0%,100%{transform:none}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-2px,1px)}}
#done .back{margin-top:18px;width:100%;max-width:380px;height:56px;border:none;border-radius:16px;background:var(--sticker);color:var(--ink);font:800 17px var(--sans);box-shadow:0 5px 0 var(--stickerD);animation:fadeUp .4s 1.8s both}
#done h2,#done p,#done>svg{display:none}
/* beszerző navigáció */
#colChip{display:none!important}
#nav{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--sab));z-index:700;display:none;background:var(--paper);border-radius:20px;box-shadow:0 4px 0 rgba(13,40,18,.55),0 12px 30px rgba(0,0,0,.35);padding:12px 14px 10px;color:var(--ink)}
body.collector #nav{display:block}
#nav .tgt{display:flex;align-items:center;gap:12px;border:none;background:none;width:100%;padding:0;text-align:left;color:inherit}
#nav .arw{width:62px;height:62px;flex:none;border-radius:50%;background:var(--forest);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
#nav .arw svg{width:38px;height:38px;transition:transform .25s ease-out}
#nav .arw.noh{background:#7c8a7c}
#nav .who{flex:1;min-width:0}
#nav .who small{display:block;font:700 12px var(--sans);color:var(--mute)}
#nav .who b{display:block;font:800 19px/1.15 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav .who i{display:block;font:600 13px var(--cond);font-style:normal;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav .dst{font:700 34px/1 var(--cond);font-variant-numeric:tabular-nums;white-space:nowrap}
#nav .dst span{font-size:16px;margin-left:2px}
#nav .load{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:8px;border-top:2px dashed var(--line)}
#nav .load svg{width:118px;height:46px;flex:none;overflow:visible}
#nav .load .lt{flex:1;font:700 14px var(--sans)}
#nav .load .lt small{display:block;font:600 12px var(--sans);color:var(--mute)}
#nav .all{border:none;background:#e5ecdb;color:var(--forest);font:800 13px var(--sans);border-radius:12px;padding:10px 12px;white-space:nowrap}
#nav.full .arw{background:var(--leaf)}
.truck.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:translateX(0)}30%{transform:translateX(-4px) translateY(2px)}100%{transform:none}}
.crate{animation:crateIn .4s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes crateIn{0%{transform:translateY(-14px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
body.collector #locBtn{bottom:calc(178px + var(--sab))}
/* üres állapot */
.empty{padding:30px 20px 36px}
.empty svg{width:120px;height:86px;display:block;margin:0 auto 12px}
.empty b{display:block;font:800 19px var(--serif);color:var(--ink);margin-bottom:4px}
.empty span{display:block;font-weight:600;color:var(--mute)}
@media (prefers-reduced-motion:reduce){#done.on .rcptW,#done.on .stamp,#done.on .roll,.tg.drop,.crate,.truck.bump{animation:none!important}}
</style>
</head>

/* ====== KÉK PÖTTY + IRÁNY ====== */
function myLL(){ return dev.virtual?virtLL:realLL; }
function inPlace(ll,p){ const b=p.b||BOUND; return !!ll && Math.abs(ll.lat-p.lat)<=b && Math.abs(ll.lng-p.lng)<=b; }
function inBounds(ll){ return inPlace(ll,PLACES[dev.place]); }
function autoPlace(){
  if(dev.virtual || dev.auto===false || !realLL || inBounds(realLL)) return;
  for(const k of Object.keys(PLACES)){
    if(inPlace(realLL,PLACES[k])){ if(dev.place!==k){ setPlace(k); toast('📍 Térkép automatikusan: '+PLACES[k].name,4500); } return; }
  }
}
function updateMe(){
  setTimeout(navArrow,0);
  const ll=myLL();
  const ok=ll && (dev.virtual || inBounds(ll));
  if(!ok){ if(meMarker){ map.removeLayer(meMarker); meMarker=null; } if(meCircle){ map.removeLayer(meCircle); meCircle=null; } return; }
  if(meMarker && (!!meMarker.options.draggable)!==dev.virtual){ map.removeLayer(meMarker); meMarker=null; }
  if(!meMarker){
    meMarker=L.marker([ll.lat,ll.lng],{draggable:dev.virtual,zIndexOffset:2000,icon:L.divIcon({className:'me-ico',iconSize:[44,44],iconAnchor:[22,22],html:'<div class="me'+(dev.virtual?' virt':'')+(hKnown&&!dev.virtual?' hasH':'')+'"><i class="pulse"></i><i class="pulse p2"></i><div class="cw"><div class="cone"></div></div><i class="dot"></i></div>'})}).addTo(map);
    meMarker.on('drag',e=>{ const q=e.target.getLatLng(); virtLL={lat:q.lat,lng:q.lng}; });
    meMarker.on('dragend',()=>{ checkNearby(); });
    applyHeading();
  } else meMarker.setLatLng([ll.lat,ll.lng]);
  if(!dev.virtual && realAcc){
    if(!meCircle) meCircle=L.circle([ll.lat,ll.lng],{radius:realAcc,color:'#1a73e8',weight:1,opacity:.4,fillColor:'#1a73e8',fillOpacity:.13,interactive:false}).addTo(map);
    else meCircle.setLatLng([ll.lat,ll.lng]).setRadius(realAcc);
  } else if(meCircle){ map.removeLayer(meCircle); meCircle=null; }
}
function setHeading(h){
  if(h==null||isNaN(h)) return;
  if(!hKnown){ hCum=h; }
  const delta=((h-(hCum%360)+540)%360)-180; hCum+=delta*0.45; hKnown=true;
  applyHeading();
}
function applyHeading(){
  if(!meMarker||!meMarker._icon) return;
  const root=meMarker._icon.querySelector('.me'), cw=meMarker._icon.querySelector('.cw');
  if(!root||!cw) return;
  root.classList.toggle('hasH',hKnown&&!dev.virtual);
  cw.style.transform='rotate('+hCum.toFixed(1)+'deg)';
  navArrow();
}
/* az eszköz dőlésével korrigált irány: a képernyő teteje és a hátoldal iránya együtt */
function hFromEuler(a,b,g,angle){
  const r=Math.PI/180, ca=Math.cos(a*r), sa=Math.sin(a*r), cb=Math.cos(b*r), sb=Math.sin(b*r), cg=Math.cos(g*r), sg=Math.sin(g*r);
  const c0=[ca*cg-sa*sb*sg, cg*sa+ca*sb*sg], c1=[-cb*sa, ca*cb], c2=[ca*sg+cg*sa*sb, sa*sg-ca*cg*sb];
  const an=((angle%360)+360)%360; let ux=0,uy=1;
  if(an===90){ux=1;uy=0;} else if(an===180){ux=0;uy=-1;} else if(an===270){ux=-1;uy=0;}
  const E=(ux*c0[0]+uy*c1[0])+(-c2[0]), N=(ux*c0[1]+uy*c1[1])+(-c2[1]);
  if(Math.hypot(E,N)<0.05) return null;
  return (Math.atan2(E,N)/r+360)%360;
}
function onOri(e){
  oriCount++;
  let h=null;
  if(e.webkitCompassHeading!=null && !isNaN(e.webkitCompassHeading)) h=e.webkitCompassHeading;
  else if((e.absolute || e.type==='deviceorientationabsolute') && e.alpha!=null && e.beta!=null && e.gamma!=null){
    const ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
    h=hFromEuler(e.alpha,e.beta,e.gamma,ang);
  }
  if(h!=null){ compassOK=true; const t=performance.now(); if(t-lastOri<60) return; lastOri=t; setHeading(h); }
}
function startOrientation(){
  window.addEventListener('deviceorientationabsolute',onOri,true);
  window.addEventListener('deviceorientation',onOri,true);
}
function askOrientationPermission(){
  try{ if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission==='function') DeviceOrientationEvent.requestPermission().catch(()=>{}); }catch(e){}
}
function startGps(){
  if(!navigator.geolocation){ toast('A böngésző nem támogatja a helymeghatározást.',5000); return; }
  if(window.isSecureContext===false){ toast('A GPS csak https címen működik – használd a fejlesztői virtuális helyet.',6000); return; }
  navigator.geolocation.watchPosition(pos=>{
    realLL={lat:pos.coords.latitude,lng:pos.coords.longitude}; realAcc=pos.coords.accuracy||0;
    if(!compassOK && pos.coords.heading!=null && !isNaN(pos.coords.heading) && (pos.coords.speed||0)>0.7) setHeading(pos.coords.heading);
    autoPlace(); updateMe(); checkNearby();
  },err=>{
    if(err.code===1) toast('A helymeghatározás tiltva. Engedélyezd a böngészőben.',7000);
  },{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
}

function tagHtml(emoji,name,q,price,cls,lift){
  return '<div class="tg '+cls+'"><div class="tag"><span class="e">'+emoji+'</span><div class="t"><b>'+esc(name)+'</b>'+(q?'<i>'+esc(q)+'</i>':'')+'</div>'+(price!=null?'<strong>'+fmt(price)+'</strong>':'')+'</div>'+'<div class="ln" style="height:'+(lift||0)+'px"></div>'+'<div class="stem"></div><div class="pt"></div></div>';
}
function pinIcon(it,lift){
  const cls=(it.collected?'done ':'')+(it.id===lastAdded?'drop ':'')+(it.id===selectedId?'sel':'');
  return L.divIcon({className:'stand-ico',iconSize:[0,0],iconAnchor:[0,0],html:tagHtml(emojiFor(it.name),it.name,qtyStr(it.qty,it.unit),it.amount,cls,lift)});
}
function renderMarkers(){
  if(!map) return;
  if(!map._ovl){ map._ovl=1; map.on('zoomend',layoutTags); }
  const keep={};
  visible().forEach(it=>{
    if(role==='collector' && it.collected) return;
    const cls=(it.collected?'done ':'')+(it.id===lastAdded?'drop ':'')+(it.id===selectedId?'sel':'');
    const sig=[it.name,it.qty,it.unit,it.amount,it.lat,it.lng,cls].join('|');
    let m=markers[it.id];
    if(m && m._sig===sig){ keep[it.id]=m; return; }
    if(m) map.removeLayer(m);
    const id=it.id;
    m=L.marker([it.lat,it.lng],{icon:pinIcon(it,0),zIndexOffset:it.id===selectedId?800:100}).addTo(map);
    m._sig=sig;
    m.on('click',()=>{ selectedId=id; renderMarkers(); role==='collector'?openCollect(id,false):openDetail(id); });
    keep[it.id]=m;
  });
  Object.keys(markers).forEach(k=>{ if(!keep[k]) map.removeLayer(markers[k]); });
  markers=keep;
  lastAdded=null;
  layoutTags();
  renderHud();
}
/* cédulák szétválasztása valódi méret alapján */
function layoutTags(){
  if(!map) return;
  const arr=[];
  Object.keys(markers).forEach(k=>{
    const m=markers[k], el=m._icon&&m._icon.querySelector('.tag'), ln=m._icon&&m._icon.querySelector('.ln');
    if(!el||!ln) return;
    const p=map.latLngToContainerPoint(m.getLatLng());
    arr.push({p,w:el.offsetWidth,h:el.offsetHeight,ln,sel:m._icon.querySelector('.sel')});
  });
  arr.sort((a,b)=>(b.sel?1:0)-(a.sel?1:0)||b.p.y-a.p.y);
  const placed=[];
  arr.forEach(o=>{
    const base=o.p.y-22; let lift=0, r;
    for(let k=0;k<10;k++){
      r={x1:o.p.x-o.w/2-3,x2:o.p.x+o.w/2+3,y1:base-o.h-lift-2,y2:base-lift+2};
      if(!placed.some(q=>r.x1<q.x2&&r.x2>q.x1&&r.y1<q.y2&&r.y2>q.y1)) break;
      lift+=o.h+6;
    }
    placed.push(r);
    o.ln.style.height=lift+'px';
  });
}

/* ====== BESZERZŐ NAVIGÁCIÓ ====== */
let navLine=null, navLastGot=-1, navTgt=null;
function bearing(a,b,c,d){ const r=Math.PI/180, y=Math.sin((d-b)*r)*Math.cos(c*r), x=Math.cos(a*r)*Math.sin(c*r)-Math.sin(a*r)*Math.cos(c*r)*Math.cos((d-b)*r); return (Math.atan2(y,x)/r+360)%360; }
function truckSvg(got,total){
  const slots=Math.max(total,1), n=Math.min(got,slots), cols=Math.min(slots,6), rows=Math.ceil(slots/cols);
  const bw=72, bh=36, cw=(bw-8)/cols, ch=Math.min(10,(bh-8)/rows);
  let cr='';
  for(let i=0;i<n;i++){ const c=i%cols, r=Math.floor(i/cols); const x=4+c*cw+1, y=4+bh-8-(r+1)*ch+4; cr+='<g class="crate" style="animation-delay:'+(i===n-1&&got>navLastGot&&navLastGot>=0?'.1':'0')+'s"><rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(cw-2).toFixed(1)+'" height="'+(ch-1.5).toFixed(1)+'" rx="1" fill="#d9a85b" stroke="#8a5a26" stroke-width="1"/></g>'; }
  return '<svg viewBox="0 0 118 46"><g class="truck">'+
    '<rect x="2" y="2" width="'+bw+'" height="'+bh+'" rx="3" fill="#fff" stroke="#164a1b" stroke-width="2.5"/>'+
    '<rect x="5" y="5" width="'+(bw-6)+'" height="'+(bh-6)+'" rx="2" fill="#eef1ea"/>'+cr+
    '<path d="M76 12h20l10 12v14H76z" fill="#fff" stroke="#164a1b" stroke-width="2.5" stroke-linejoin="round"/><path d="M80 16h14l7 9H80z" fill="#bfe0f0" stroke="#164a1b" stroke-width="1.6" stroke-linejoin="round"/>'+
    '<rect x="2" y="38" width="104" height="3" rx="1.5" fill="#164a1b"/>'+
    '<circle cx="20" cy="41" r="5.5" fill="#1d241d"/><circle cx="20" cy="41" r="2" fill="#ccc"/><circle cx="92" cy="41" r="5.5" fill="#1d241d"/><circle cx="92" cy="41" r="2" fill="#ccc"/>'+
    '</g></svg>';
}
function renderNav(){
  const nv=$('nav'); if(!nv) return;
  if(role!=='collector'){ if(navLine){ map.removeLayer(navLine); navLine=null; } return; }
  const list=visible(), open=list.filter(i=>!i.collected), got=list.length-open.length, ll=myLL();
  let tgt=null, td=null;
  if(open.length){
    if(ll){ open.forEach(i=>{ const d=dist(ll.lat,ll.lng,i.lat,i.lng); if(td==null||d<td){ td=d; tgt=i; } }); }
    else tgt=open.slice().sort((a,b)=>a.ts-b.ts)[0];
  }
  navTgt=tgt;
  const bump=navLastGot>=0 && got>navLastGot;
  let h='';
  if(tgt){
    const ds=td==null?'–':td<1000?'<b>'+Math.round(td)+'</b><span>m</span>':'<b>'+(td/1000).toFixed(1).replace('.',',')+'</b><span>km</span>';
    h+='<button class="tgt" id="navGo"><div class="arw'+(ll?'':' noh')+'"><svg viewBox="0 0 40 40"><path d="M20 4l11 30-11-7-11 7z" fill="#ffd23f" stroke="#0d2812" stroke-width="2" stroke-linejoin="round"/></svg></div>'+
      '<div class="who"><small>Legközelebbi tű</small><b>'+emojiFor(tgt.name)+' '+esc(tgt.name)+'</b><i>'+esc([qtyStr(tgt.qty,tgt.unit),tgt.stand].filter(Boolean).join(' · ')||'—')+'</i></div><div class="dst">'+ds.replace(/<\/?b>/g,'')+'</div></button>';
  } else if(list.length){
    h+='<div class="tgt"><div class="arw" style="background:var(--leaf)"><svg viewBox="0 0 40 40"><path d="M10 21l7 7 14-15" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="who"><small>Kész</small><b>Minden felpakolva</b><i>Indulhatsz.</i></div></div>';
  } else {
    h+='<div class="tgt"><div class="arw noh"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="6" fill="#fff"/></svg></div><div class="who"><small>Várakozás</small><b>Még nincs tű</b><i>Ha a bevásárló rögzít valamit, itt megjelenik.</i></div></div>';
  }
  h+='<div class="load">'+truckSvg(got,list.length)+'<div class="lt">'+got+' / '+list.length+' felpakolva<small>'+(open.length?open.length+' tű vár még':'')+'</small></div><button class="all" id="navAll">Lista</button></div>';
  nv.innerHTML=h; nv.classList.toggle('full',!open.length&&!!list.length);
  if(bump){ const t=nv.querySelector('.truck'); if(t) t.classList.add('bump'); }
  navLastGot=got;
  const g=$('navGo'); if(g) g.onclick=()=>{ selectedId=tgt.id; map.setView([tgt.lat,tgt.lng],Math.max(map.getZoom(),19)); renderMarkers(); openCollect(tgt.id,false); };
  $('navAll').onclick=openToday;
  navArrow();
}
function navArrow(){
  const nv=$('nav'); if(!nv||role!=='collector') return;
  const ll=myLL(), tgt=navTgt, svg=nv.querySelector('.arw svg');
  if(navLine && (!tgt||!ll)){ map.removeLayer(navLine); navLine=null; }
  if(!tgt||!ll||!svg) return;
  const b=bearing(ll.lat,ll.lng,tgt.lat,tgt.lng), rot=b-((hKnown&&!dev.virtual)?(hCum%360):0);
  svg.style.transform='rotate('+rot.toFixed(0)+'deg)';
  const d=dist(ll.lat,ll.lng,tgt.lat,tgt.lng), el=nv.querySelector('.dst');
  if(el) el.innerHTML=d<1000?Math.round(d)+'<span>m</span>':(d/1000).toFixed(1).replace('.',',')+'<span>km</span>';
  const pts=[[ll.lat,ll.lng],[tgt.lat,tgt.lng]];
  if(!navLine) navLine=L.polyline(pts,{color:'#ffd23f',weight:4,dashArray:'2 10',lineCap:'round',interactive:false}).addTo(map);
  else navLine.setLatLngs(pts);
}
function renderHud(){

async function compress(file){
  /* memóriakímélő: nagy fotót nem olvasunk be base64-ként, hanem közvetlenül kicsinyítjük */
  try{
    let bmp=null;
    if(window.createImageBitmap){
      try{ bmp=await createImageBitmap(file,{resizeWidth:720,resizeQuality:'medium'}); }catch(e){ bmp=null; }
    }
    let w,h,src;
    if(bmp){ w=bmp.width; h=bmp.height; src=bmp; }
    else {
      const url=URL.createObjectURL(file);
      const im=await new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=url; });
      const s=Math.min(1,720/Math.max(im.naturalWidth,im.naturalHeight));
      w=Math.round(im.naturalWidth*s); h=Math.round(im.naturalHeight*s); src=im;
      var revoke=url;
    }
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(src,0,0,w,h);
    if(bmp&&bmp.close) bmp.close(); if(revoke) URL.revokeObjectURL(revoke);
    return c.toDataURL('image/jpeg',.6);
  }catch(e){ return null; }
}

function aggregate(){
  const m={};
  lists.forEach(c=>c.items.forEach(n=>{ const k=norm(n.name)+'|'+nu(n.unit); const g=m[k]||(m[k]={key:k,name:n.name,unit:n.unit||'',need:0,entries:[]}); g.need+=n.qty||0; g.entries.push({qty:n.qty,customer:c.name}); }));
  const t=visible();
  Object.values(m).forEach(g=>{
    g.bought=0; g.any=false;
    t.forEach(i=>{ if(norm(i.name)!==norm(g.name)) return; g.any=true; if(i.qty!=null && nu(i.unit)===nu(g.unit)) g.bought+=i.qty; });
    g.done=g.need>0?g.bought>=g.need-1e-9:g.any;
  });
  return Object.values(m);
}
function parseOne(s){
  s=s.trim().replace(/^[-•*]\s+/,''); if(!s) return null; let m;
  if(/^(tisztelt|kedves|szia|üdv|köszön|kérem|jó napot|jó reggelt|a következ|tárgy|from|feladó)/i.test(s)) return null;
  if((m=s.match(/^(\d+(?:[.,]\d+)?)\s*([\p{L}.]+)?\s+(.+)$/u))) return {name:m[3].trim(),qty:parseQty(m[1]),unit:(m[2]||'').replace(/\.$/,'')};
  if((m=s.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)\s*([\p{L}.]+)?$/u))) return {name:m[1].trim(),qty:parseQty(m[2]),unit:(m[3]||'').replace(/\.$/,'')};
  if(s.split(/\s+/).length<=3 && !/[.!?:]$/.test(s)) return {name:s,qty:null,unit:''};
  return null;
}
function parseMail(text){
  const out=[];
  text.split(/\r?\n/).forEach(line=>{ line.split(/[;,]/).forEach(p=>{ const r=parseOne(p); if(r&&r.name) out.push(r); }); });
  return out;
}

  $('dDay').onclick=()=>{ dev.dayOffset++; saveDev(); renderMarkers(); renderDev(); toast('🌙 Éjfél elmúlt – a mai tűk eltűntek a térképről.'); };
  $('dDay0').onclick=()=>{ dev.dayOffset=0; saveDev(); renderMarkers(); renderDev(); };
  let armed=false;
  $('dClr').onclick=()=>{ if(!armed){ armed=true; $('dClr').textContent='Biztosan? Még egyszer'; return; } items=[]; lists=[]; closedMap={}; saveItems(); saveLists(); saveClosed(); sdel(LS.draft); renderMarkers(); renderDev(); toast('Minden adat törölve.'); };
  body.scrollTop=st;
}

/* ====== INDÍTÁS ====== */
/* ====== FIREBASE SZINKRON (Realtime Database + anonim Auth) ====== */
const FB_CFG={apiKey:"AIzaSyBC1NY6l0mUkRUnq1xwxrsRjLJkMk3vMuc",authDomain:"nagybanibeszerzes.firebaseapp.com",databaseURL:"https://nagybanibeszerzes-default-rtdb.europe-west1.firebasedatabase.app",projectId:"nagybanibeszerzes",storageBucket:"nagybanibeszerzes.firebasestorage.app",messagingSenderId:"506531563073",appId:"1:506531563073:web:b26be5e1e47154f27128c0"};
const SY={db:null,ready:false,first:{},sent:{items:{},lists:{},closed:{}},keep:30};
let curBuild=null;
function syState(s){ const b=$('optBtn'); if(!b) return; b.classList.remove('sy-on','sy-off'); b.classList.add(s); SY.state=s; }
/* kanonikus alak: rendezett kulcsok, üres tömb/objektum/null eldobva (ahogy az RTDB tárolja) */
function cn(v){
  if(v===null||v===undefined) return undefined;
  if(Array.isArray(v)){ const a=v.map(cn).filter(x=>x!==undefined); return a.length?a:undefined; }
  if(typeof v==='object'){ const o={}; let n=0; Object.keys(v).sort().forEach(k=>{ const x=cn(v[k]); if(x!==undefined){ o[k]=x; n++; } }); return n?o:undefined; }
  return v;
}
function cj(v){ const x=cn(v); return x===undefined?'':JSON.stringify(x); }
function byId(a){ const m={}; a.forEach(x=>{ if(x&&x.id) m[x.id]=x; }); return m; }
function syLocal(kind){ return kind==='items'?byId(items):kind==='lists'?byId(lists):closedMap; }
function syCutoff(){ const d=new Date(Date.now()-SY.keep*864e5); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function syPush(kind){
  if(!SY.db||!SY.ready||!SY.first[kind]) return;
  const cur=syLocal(kind), sent=SY.sent[kind], upd={};
  Object.keys(cur).forEach(k=>{ const js=cj(cur[k]); if(js!==sent[k]){ upd[k]=JSON.parse(JSON.stringify(cur[k])); sent[k]=js; } });
  Object.keys(sent).forEach(k=>{ if(!(k in cur)){ upd[k]=null; delete sent[k]; } });
  const ks=Object.keys(upd), ref=SY.db.ref('beszerzes/'+kind);
  for(let i=0;i<ks.length;i+=4){ const part={}; ks.slice(i,i+4).forEach(k=>part[k]=upd[k]); ref.update(part).catch(e=>{ syState('sy-off'); }); }
}
function stampOf(i){ return Math.max(i.ts||0,i.edited||0,i.collectedTs||0); }
function syMerge(kind,remote){
  const loc=syLocal(kind), out=Object.assign({},remote);
  if(kind==='items'){
    const cut=syCutoff();
    Object.keys(loc).forEach(k=>{ const l=loc[k]; if(l.date<cut) return; if(!out[k]||stampOf(l)>stampOf(out[k])) out[k]=l; });
  } else if(kind==='lists'){
    const names={}; Object.keys(out).forEach(k=>names[norm(out[k].name||'')]=k);
    Object.keys(loc).forEach(k=>{
      if(out[k]) return;
      const nk=names[norm(loc[k].name||'')];
      if(nk){ const t=out[nk]; t.items=t.items||[]; (loc[k].items||[]).forEach(n=>{ if(!t.items.some(x=>x.id===n.id)) t.items.push(n); }); }
      else out[k]=loc[k];
    });
  } else Object.keys(loc).forEach(k=>{ if(!out[k]) out[k]=loc[k]; });
  return out;
}
function syApply(kind,map){
  if(kind==='items'){
    const old=byId(items);
    items=Object.keys(map).map(k=>map[k]).filter(x=>x&&x.id);
    sset(LS.items,JSON.stringify(items));
    if(role==='collector'){ const t=today(); const nw=items.filter(i=>!old[i.id]&&i.date===t&&!i.collected); if(nw.length&&SY.first.items===2) toast('📍 Új tű: '+nw[nw.length-1].name,3000); }
  } else if(kind==='lists'){
    lists=Object.keys(map).map(k=>map[k]).filter(x=>x&&x.id); lists.forEach(c=>{ c.items=c.items||[]; });
    sset(LS.lists,JSON.stringify(lists));
  } else { closedMap=map; sset(LS.closed,JSON.stringify(closedMap)); }
}
function syRefresh(){
  renderMarkers(); renderHud();
  const a=document.activeElement, typing=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName);
  if($('page').classList.contains('open') && curBuild && !typing) curBuild();
}
function syOn(kind,snap){
  const remote=snap.val()||{}, sent=SY.sent[kind];
  if(!SY.first[kind]){
    const merged=syMerge(kind,remote);
    Object.keys(remote).forEach(k=>sent[k]=cj(remote[k]));
    syApply(kind,merged); SY.first[kind]=1; syPush(kind); SY.first[kind]=2; syRefresh(); return;
  }
  let same=true; const rk=Object.keys(remote), sk=Object.keys(sent);
  if(rk.length!==sk.length) same=false; else rk.forEach(k=>{ if(cj(remote[k])!==sent[k]) same=false; });
  if(same) return;
  Object.keys(sent).forEach(k=>delete sent[k]); rk.forEach(k=>sent[k]=cj(remote[k]));
  syApply(kind,remote); syRefresh();
}
function syncInit(){
  if(typeof firebase==='undefined'){ syState('sy-off'); return; }
  try{
    firebase.initializeApp(FB_CFG); SY.db=firebase.database();
    SY.db.ref('.info/connected').on('value',s=>syState(s.val()?'sy-on':'sy-off'));
    firebase.auth().onAuthStateChanged(u=>{
      if(!u||SY.ready) return; SY.ready=true;
      const base=SY.db.ref('beszerzes');
      base.child('items').orderByChild('date').startAt(syCutoff()).on('value',s=>syOn('items',s),()=>syState('sy-off'));
      base.child('lists').on('value',s=>syOn('lists',s),()=>syState('sy-off'));
      base.child('closed').on('value',s=>syOn('closed',s),()=>syState('sy-off'));
      try{ base.child('items').orderByChild('date').endAt(syCutoff()).once('value').then(s=>{ const v=s.val()||{}, up={}; Object.keys(v).forEach(k=>{ if(v[k]&&v[k].photo) up[k+'/photo']=null; }); if(Object.keys(up).length) base.child('items').update(up); }).catch(()=>{}); }catch(e){}
    });
    firebase.auth().signInAnonymously().catch(()=>syState('sy-off'));
  }catch(e){ syState('sy-off'); }
}

function boot(){
  $('splashLogo').innerHTML=logoSVG(); $('brandImg').src=LOGO_WORD;
  initMap(); lastDay=today(); syncInit();
  renderHud(); startGps(); startOrientation(); updateMe();
    setTimeout(()=>{
    $('splash').classList.add('out'); setTimeout(()=>{ const s=$('splash'); if(s) s.remove(); },700);
    showPicker();
  },3600);
}
window.addEventListener('load',boot);
})();
</script>
